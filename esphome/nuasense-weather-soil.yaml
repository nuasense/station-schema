# An ESPHome weather and soil station that sends to NuaSense every 5 minutes.
# ESP32 + BME280 (I2C) + one capacitive soil moisture sensor on GPIO34.
#
# Token: NuaSense console → External stations → Add a station → "I built it myself".
# Field names and units: ../nuasense-reading.schema.json. A name not on that
# list is not stored. Works next to Home Assistant; no Home Assistant needed.
substitutions:
  name: garden-station
  nuasense_token: xxxx-xxxx-xxxx

esphome:
  name: ${name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:

i2c:
  sda: GPIO21
  scl: GPIO22

sensor:
  - platform: bme280_i2c
    address: 0x76
    update_interval: 60s
    temperature:
      id: air_temperature
      name: Air temperature
    humidity:
      id: air_humidity
      name: Air humidity
    pressure:
      id: air_pressure
      name: Air pressure
  - platform: adc
    pin: GPIO34
    id: soil_moisture
    name: Soil moisture
    attenuation: 12db
    update_interval: 60s
    unit_of_measurement: "%"
    filters:
      # dry air reads about 2.8 V, a glass of water about 1.2 V: measure yours
      - calibrate_linear:
          - 2.8 -> 0.0
          - 1.2 -> 100.0
      - clamp:
          min_value: 0
          max_value: 100

http_request:
  useragent: nuasense-esphome/0.1.0
  timeout: 10s
  verify_ssl: true

interval:
  - interval: 5min
    then:
      - http_request.post:
          url: https://api.nuasense.com/station/${nuasense_token}
          request_headers:
            Content-Type: application/json
          json: |-
            root["device_id"] = App.get_name();
            root["software"] = "nuasense-esphome/0.1.0";
            if (!std::isnan(id(air_temperature).state)) root["temperature"] = id(air_temperature).state;
            if (!std::isnan(id(air_humidity).state)) root["humidity"] = id(air_humidity).state;
            if (!std::isnan(id(air_pressure).state)) root["pressure"] = id(air_pressure).state;
            if (!std::isnan(id(soil_moisture).state)) root["soil_moisture"] = id(soil_moisture).state;
